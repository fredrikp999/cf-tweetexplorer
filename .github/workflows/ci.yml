name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types        # generates worker-configuration.d.ts from wrangler.jsonc
      - run: npm run typecheck
      - run: npm test
      - run: npm run build        # bundles the Worker without deploying it
